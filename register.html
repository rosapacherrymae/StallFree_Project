<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create an account | StallFree</title>
    <meta
      name="description"
      content="Register for a StallFree account and keep your cart, orders, and saved stalls together in this browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a1f'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Georgia'>S</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="register">
    <header id="site-header"></header>

    <main class="container auth-wrap">
      <section class="card auth-card">
        <span class="auth-badge" aria-hidden="true">S</span>
        <h1 class="auth-title">Create your account</h1>
        <p class="muted small auth-sub">
          One account keeps your cart, orders, and saved stalls together in this browser.
        </p>

        <div class="banner hidden" id="register-banner" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="rg-name">Full name *</label>
            <input
              type="text"
              id="rg-name"
              class="input"
              placeholder="Juan Dela Cruz"
              autocomplete="name"
            />
            <p class="field-error hidden" id="rg-name-error"></p>
          </div>

          <div class="form-group">
            <label for="rg-email">Email address *</label>
            <input
              type="email"
              id="rg-email"
              class="input"
              placeholder="you@email.com"
              autocomplete="email"
            />
            <p class="field-error hidden" id="rg-email-error"></p>
          </div>

          <div class="form-group">
            <label for="rg-password">Password *</label>
            <input
              type="password"
              id="rg-password"
              class="input"
              placeholder="At least 8 characters"
              autocomplete="new-password"
            />
            <button type="button" class="link-btn pw-toggle" data-toggle-password="rg-password" aria-pressed="false">Show</button>
            <p class="field-error hidden" id="rg-password-error"></p>
            <p class="muted small form-hint">At least 8 characters, with a letter and a number.</p>
          </div>

          <div class="form-group">
            <label for="rg-confirm">Confirm password *</label>
            <input
              type="password"
              id="rg-confirm"
              class="input"
              placeholder="Type it again"
              autocomplete="new-password"
            />
            <button type="button" class="link-btn pw-toggle" data-toggle-password="rg-confirm" aria-pressed="false">Show</button>
            <p class="field-error hidden" id="rg-confirm-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="register-btn">
            Create account
          </button>
        </form>

        <div class="auth-links">
          <p class="muted small">Already registered? <a href="login.html">Sign in</a></p>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
