<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products | StallFree</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="products">
  <header id="site-header"></header>

  <main class="container">
    <div style="margin:24px 0 20px">
      <h1>Products</h1>
      <p class="tagline">Search, filter, and sort the marketplace catalog.</p>
    </div>

    <div class="toolbar">
      <div class="form-group search-input">
        <label for="search">Search</label>
        <input type="text" id="search" class="input" placeholder="Search products..." oninput="renderProducts()">
      </div>
      <div class="form-group">
        <label for="filter-category">Category</label>
        <select id="filter-category" class="select" onchange="renderProducts()">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="form-group">
        <label for="filter-price">Max price</label>
        <select id="filter-price" class="select" onchange="renderProducts()">
          <option value="0">Any price</option>
          <option value="500">Under &#8369;500</option>
          <option value="1000">Under &#8369;1,000</option>
          <option value="2000">Under &#8369;2,000</option>
        </select>
      </div>
      <div class="form-group">
        <label for="sort">Sort by</label>
        <select id="sort" class="select" onchange="renderProducts()">
          <option value="featured">Featured</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="rating">Top rated</option>
          <option value="name">Name A-Z</option>
        </select>
      </div>
    </div>

    <p class="muted" id="results-count" style="margin-bottom:12px"></p>

    <div class="grid products-grid" id="products-grid"></div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
