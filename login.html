<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in | StallFree</title>
    <meta
      name="description"
      content="Sign in to StallFree to reach your orders, saved items, and profile in this browser."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23ff5a1f'/><text x='50' y='72' font-size='64' text-anchor='middle' fill='white' font-family='Georgia'>S</text></svg>"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-page="login">
    <header id="site-header"></header>

    <main class="container auth-wrap">
      <!-- ============ Sign in ============ -->
      <section class="card auth-card" id="signin-panel">
        <img class="auth-badge" src="asset/StallFree%20Market%20Stall%20Logo.png" alt="StallFree logo" width="88" height="88" />
        <h1 class="auth-title">Welcome back</h1>
        <p class="muted small auth-sub">
          Sign in to reach your orders, saved items, and profile in this browser.
        </p>

        <div class="banner hidden" id="login-banner" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="li-email">Email address *</label>
            <input
              type="email"
              id="li-email"
              class="input"
              placeholder="you@email.com"
              autocomplete="email"
            />
            <p class="field-error hidden" id="li-email-error"></p>
          </div>

          <div class="form-group">
            <label for="li-password">Password *</label>
            <input
              type="password"
              id="li-password"
              class="input"
              placeholder="Your password"
              autocomplete="current-password"
            />
            <button type="button" class="link-btn pw-toggle" data-toggle-password="li-password" aria-pressed="false">Show</button>
            <p class="field-error hidden" id="li-password-error"></p>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-btn">Sign in</button>
        </form>

        <div class="auth-links">
          <p class="muted small">New to StallFree? <a href="register.html">Create an account</a></p>
        </div>
      </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
