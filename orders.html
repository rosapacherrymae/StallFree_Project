<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Order | StallFree</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="orders">
  <header id="site-header"></header>

  <main class="container">
    <div style="margin:24px 0 20px">
      <h1>Your Order</h1>
      <p class="tagline">Review your cart, check out, and track your order history.</p>
    </div>

    <div class="banner banner-success hidden" id="order-banner"></div>

    <section class="section">
      <div class="section-header">
        <h2>Cart</h2>
        <span class="muted" id="cart-count"></span>
      </div>

      <div class="cart-layout">
        <div id="cart-list"></div>

        <div>
          <div class="card summary-card">
            <h3 style="margin-bottom:8px">Order summary</h3>
            <div id="cart-summary"></div>

            <button class="btn btn-primary btn-block" id="checkout-btn" style="margin-top:14px"
              onclick="toggleCheckout()">Proceed to checkout</button>
          </div>

          <div class="card summary-card hidden" id="checkout-form" style="margin-top:16px">
            <h3 style="margin-bottom:12px">Checkout details</h3>

            <div class="banner banner-danger hidden" id="checkout-error"
              style="background:var(--danger-soft);color:var(--danger)">
              Please complete all required fields.
            </div>

            <div class="form-group">
              <label for="co-name">Full name *</label>
              <input type="text" id="co-name" class="input" placeholder="Juan Dela Cruz">
              <p class="muted hidden" id="err-name" style="font-size:.78rem;color:var(--danger);margin-top:4px">Name is required.</p>
            </div>

            <div class="form-group">
              <label for="co-phone">Phone number *</label>
              <input type="tel" id="co-phone" class="input" placeholder="0917 123 4567">
              <p class="muted hidden" id="err-phone" style="font-size:.78rem;color:var(--danger);margin-top:4px">Phone is required.</p>
            </div>

            <div class="form-group">
              <label for="co-address">Delivery address *</label>
              <textarea id="co-address" class="textarea" rows="3" placeholder="House no., street, city"></textarea>
              <p class="muted hidden" id="err-address" style="font-size:.78rem;color:var(--danger);margin-top:4px">Address is required.</p>
            </div>

            <button class="btn btn-primary btn-block" onclick="placeOrder()">Place order</button>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-header">
        <h2>Order history</h2>
      </div>
      <div id="order-history"></div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
